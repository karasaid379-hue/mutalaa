name: eas-build

# Starts an EAS cloud build (paid, CLAUDE.md rule 11). Triggers: manual run or a mobile-v* tag.
# Pushing such a tag starts a production build. Store submission (eas submit) is never run here.
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [internal, production]
        default: internal
      platform:
        type: choice
        options: [android, ios, all]
        default: all
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: eas-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Placed before any step that sees the Expo secret; the app does not exist until A21.
      - name: Require the mobile app
        run: |
          if [ ! -f apps/mobile/package.json ]; then
            echo "::error::apps/mobile does not exist yet (A21). No EAS build was started."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: 26.0.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build
        working-directory: apps/mobile
        env:
          PROFILE: ${{ inputs.profile || 'production' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: eas build --non-interactive --no-wait --profile "$PROFILE" --platform "$PLATFORM"
