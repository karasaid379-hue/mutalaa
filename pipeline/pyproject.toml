[project]
name = "mutalaa-pipeline"
version = "0.1.0"
description = "Mutalaa icerik hatti: kaynak alma, normalizasyon, capa, zenginlestirme, QA ve PostgreSQL yukleme."
requires-python = ">=3.13,<3.14"
dependencies = [
  "typer",              # komut satiri
  "pydantic-settings",  # yapilandirma
  "psycopg[binary]",    # PostgreSQL
  "regex",              # Unicode ozellikli duzenli ifade
  "rapidfuzz",          # bulanik eslesme
  "httpx",              # indirme
  "anthropic",          # yapay zeka taslaklari
  "snowballstemmer==3.1.1",  # Turkce govde (K-36 madde 6); tam surum sabit, BSD-3-Clause
  "mwparserfromhell==0.7.2",
]

[project.optional-dependencies]
arapca = ["camel-tools>=1.6"]      # v1.6.0 Python 3.11-3.14 destekliyor
turkce = ["zeyrek"]                # alfa surum
gomme  = ["sentence-transformers"] # anlamsal katman, sonra

[project.scripts]
mutalaa = "mutalaa_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutalaa_pipeline"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# PLW1514 (unspecified-encoding) onizleme kuralidir; CLAUDE.md kural 6 (encoding="utf-8")
extend-select = ["PLW1514"]
preview = true
explicit-preview-rules = true

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "stubs"  # snowballstemmer tip bilgisi tasimaz: yerel taslak (ignore_missing_imports yok)
files = ["src"]  # scripts/ klasoru acildiginda ("src", "scripts") yapilir; var olmayan yol mypy hatasi verir

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "degismezlik: Tanzil metninin hicbir adimda degismedigini kanitlayan testler (gercek veri ya da fikstur)",
  "veritabani: yerel PostgreSQL test veritabani (mutalaa_test) gerektiren testler",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
