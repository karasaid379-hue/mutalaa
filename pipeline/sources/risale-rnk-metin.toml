notlar = '''
K-51: Diyanet deposunda (risale-asil-nusha) bulunmayan metin bu kaynaktan gelir: Asâr-ı Bedîiyye ve Latif Nükteler'in Diyanet dışı kısmı, derlemelerin Diyanet'te olmayan parçaları, Osmanlıca (osm) ve Arapça (ar, ar_k) kitapların tamamı. Derleme kitaplarda Diyanet'te bulunan paragraf Diyanet'ten kopyalanır (provenance'ta kaynak çapa).
Dosyalar risale-baski-rnk ile aynıdır (data/gelen/risale-baski-rnk/2026-11-12/); ikinci kez indirilmez.
Metin üçüncü taraf kanonik metindir: bayt bayt saklanır, NFC uygulanmaz (K-26). RNK işaretlemesi yapıya çevrilir, anlamı çıkmayan işaret yorumlanmaz.
Arapça kitapların mütercimi ve Osmanlıca baskıların künyesi RNK verisinde yoktur; hafızadan yazılmaz, editör doldurur (İ-24).
Birimler taslak girer; kitap bazında toplu onayla açılır (K-51 madde 11).'''
