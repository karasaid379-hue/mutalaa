notlar = '''
K-51 madde 1-3 (13 Kasım 2026 kararı: RNK yayınlarına öncelik): RNK Türkçe (tr, tr_k), Osmanlıca (osm) ve Arapça (ar, ar_k) raflarındaki bütün kitapların birimleri, çapaları ve metni bu kaynaktan gelir; birincil metin kaynağıdır. Derleme kitaplar kendi slug'ı, kendi rn: çapaları ve kendi metniyle girer; metin RNK'dan alınır.
Diyanet deposu (risale-asil-nusha) karşılaştırma ve doğrulama verisidir, birim olarak yüklenmez; karşılaştırma raporu kitap başına yazılır, Diyanet'te olup RNK'da bulunmayan ya da farklı olan kısım raporlanır, metne eklenmez.
Dosyalar risale-baski-rnk ile aynıdır (data/gelen/risale-baski-rnk/2026-11-12/); ikinci kez indirilmez.
Metin üçüncü taraf kanonik metindir: bayt bayt saklanır, NFC uygulanmaz (K-26). RNK işaretleme karakterleri birim metninden çıkarılır ve marks'a yazılır (t: "rnk"); yalnız #n sayfa işaretleri ve ,* * *> ayraç satırları birim üretmez. Anlamı veriden çıkmayan işaret yorumlanmaz.
Arapça kitapların mütercimi ve Osmanlıca baskıların künyesi RNK verisinde yoktur; hafızadan yazılmaz, editör doldurur (İ-24).
Birimler taslak girer; kitap bazında toplu onayla açılır (K-51 madde 11).'''
