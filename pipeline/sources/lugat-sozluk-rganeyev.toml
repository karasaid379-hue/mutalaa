Biçim: UTF-8, satır başına başlık: tanım (56.541 satır, 56.537 geçerli madde, 50.382 benzersiz eşleme anahtarı); 4 satırda ayraç yok. Alınan 1.999 maddenin 3'ünün tanımı 2.000 kod noktasından uzundur (kilitte `uzun_tanim`): düzenlemesiz onaylanabilir, düzenlenecekse editör kısaltır.
Sürüm: sabit commit (25 Nisan 2017 tarihli); sürüm etiketi yok. Alma: data/gelen/lugat-sozluk-rganeyev/2026-11-15/ (words.txt, SHA256SUMS).
Bilinen kusur: bazı sözlerde i yerine î yazılmış ("îstek", "îndirme"); düzeltilmez, kaynak bayt bayt saklanır, rapora sayılır. Anlamlar arasında * ayracı korunmuş.
Eser kimliği: depo eser adı beyan etmez. Abdullah Yeğin'in Yeni Lûgat'ı (Hizmet Vakfı, 1997; kaynak kaydı lugat-yegin-yeni-lugat) ile örneklemde tanımlar örtüşüyor; tanıklıktır, eser adı olarak yazılmaz (Doğrulanacak: İ-28).'''
