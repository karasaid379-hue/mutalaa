notlar = '''
Naim ö. 13 Ağustos 1934 (Küre: https://kureansiklopedi.com/tr/detay/miras-kamil); 1 Ocak 2005'ten beri serbest. Kurul: Gerekmez (çıkarım).
Naim'in çevirdiği ciltler Doğrulanacak (A19); o zamana kadar III. cilt Miras kısmı sayılır. A19 cilt doğrulaması bitmeden III. cilt ingest edilmez.
Küre (Hansu, 2024): Naim mukaddimeyle 477 hadisi iki cilt hâlinde yayımladı (İstanbul 1346/1928); III. cildi hazırladı, yayımlanmadan öldü, Miras gözden geçirip yayımladı. Naim'in çevirdiği 589, baskıda 574 hadis görünüyor (Doğrulanacak). TDV İA (Babanzâde) ilk üç cildi Naim'e veriyor.
İTÜ Dijital Koleksiyonlar: 1926-1928, c.1-3, dil "Osmanlıca"; yalnız üst veri görülebiliyor, "Copyright hakları saklıdır". Açık tarama yok.
Diyanet ePUB (yayin.diyanet.gov.tr) arama özetine göre ücretli, modern baskı ve Miras ciltlerini de içeriyor (Doğrulanacak); kaynak olarak kullanılmaz.
Sonraki baskılardaki sadeleştirme ve editoryal ek kullanılmaz.'''
