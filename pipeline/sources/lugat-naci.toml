notlar = '''
İki yazarlı eser: Muallim Nâci; tamamlayan Müstecâbîzâde İsmet Bey.
Baskı: hicrî 1322 baskısında (miladi karşılığı ve baskı tarihi Doğrulanacak) Tâhirülmevlevî maddeleri alfabetik dizdi, bazılarını değiştirdi ve örnek ekledi; yalnız Nâci ve İsmet Bey'in metnini taşıyan 1317 ya da 1318 baskısı önerilir.
Tarama: archive.org lgatnaci0001na (Duke kopyası, Internet Archive'ın kendi Scribe taraması, 400 ppi, 832 görüntü, Asır Matbaası 1900). IA yazar ve matbaa alanlarında Türkçe karakterler bozuktur ve yazar olarak yalnız Muallim Nâci geçer; atıfta bu alanlar olduğu gibi kullanılmaz.
Dijital kopya kaynağı ve baskı seçimi: Doğrulanacak.'''
