Açık soru: tarama kaynağı A09 tedarikinde ve pilot ölçümüyle seçilir; basılı takım (İ-09) yalnız internetteki taramalar ofset sınamasını geçmezse gerekir. Adaylar: archive.org HakDiniKuranDili (Eser 1979; tıpkıbasım kanıtlanmadı), İBB Atatürk Kitaplığı nüshaları, HathiTrust 1935 (yalnız arama); gerekirse sahaftan 1935 ya da 1960/1971 ofset takımı (TDV İA'ya göre ofset baskılar ilk baskıdan). Seçim yapılmadı (docs/04-icerik/01-kaynaklar.md §3.3).
Hazır dijital meal metinleri (Vikikaynak, Tanzil ve Açık Kuran'daki Elmalılı metinleri) A09 pilotunda OCR ile yarışır; baskı esası ölçümle belirlenir (K-38).
