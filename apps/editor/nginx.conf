# Mutalaa editor panel: statik SPA ve /api/ vekili (compose: editor -> api:8080).
# Panel yalniz yerelde calisir (127.0.0.1:5174); dis aga acilmaz.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker'in yerlesik DNS'i: api adi istek aninda cozulur, api kapaliyken nginx yine baslar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    # Guvenlik basliklari yalniz burada tanimlanir: bir location icinde add_header yazilirsa bunlar o location'a
    # miras kalmaz; onbellek icin add_header yerine expires kullanilir.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        set $api_upstream http://api:8080;
        # Degiskenli proxy_pass URI kismi olmadan istegi oldugu gibi (/api/... on ekiyle) iletir.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Vite vekiliyle ayni davranis: Host degismez, API tarayicinin kaynagini gorur.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Amiri Quran (OFL): tarayici font/ttf turunu bekler.
    location /fonts/ {
        types {
            font/ttf ttf;
            text/plain txt;
        }
        default_type application/octet-stream;
        expires 30d;
        try_files $uri =404;
    }

    # Ozetli dosya adlari: degismez, uzun sure onbellekte durur.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA geri donusu: bilinmeyen yollar index.html'e gider (react-router istemci tarafinda cozer).
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
